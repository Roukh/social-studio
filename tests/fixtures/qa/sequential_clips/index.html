<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 100%; height: 100%; font-family: sans-serif; }
      /* Two shots in the same place, one after the other: a hard cut, never on screen together. */
      .line { position: absolute; left: 90px; top: 700px; color: #111111; font-weight: 800; font-size: 84px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.4" data-width="1080" data-height="1920"
         data-fps="30">
      <div id="a" class="line clip" data-start="0" data-duration="1.2" data-track-index="0">FIRST SHOT</div>
      <div id="b" class="line clip" data-start="1.2" data-duration="1.2" data-track-index="1">SECOND ONE</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#b", { x: 0 }, { x: 0, duration: 0.01 }, 1.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
