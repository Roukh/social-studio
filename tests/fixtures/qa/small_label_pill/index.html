<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 100%; height: 100%; font-family: sans-serif; }
      .label { position: absolute; left: 100px; top: 700px; color: #111111; font-weight: 600; font-size: 26px; }
      .pill { position: absolute; left: 100px; top: 780px; color: #111111; font-weight: 400; font-size: 18px;
              background: #eeeeee; padding: 10px 24px; border-radius: 40px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1.5" data-width="1080" data-height="1920"
         data-fps="30">
      <div class="label clip" data-start="0" data-duration="1.5" data-track-index="0">Limited drop</div>
      <div class="pill clip" data-start="0" data-duration="1.5" data-track-index="1">Sample</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
