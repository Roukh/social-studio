<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 100%; height: 100%; font-family: sans-serif; }
      .a { position: absolute; left: 200px; top: 700px; color: #111111; font-weight: 700; font-size: 70px; }
      .b { position: absolute; left: 260px; top: 730px; color: #111111; font-weight: 700; font-size: 70px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1.5" data-width="1080" data-height="1920"
         data-fps="30">
      <div class="a clip" data-start="0" data-duration="1.5" data-track-index="0">ALPHA</div>
      <div class="b clip" data-start="0" data-duration="1.5" data-track-index="1">BETA</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
