<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 100%; height: 100%; font-family: sans-serif; }
      .title { position: absolute; left: 90px; top: 650px; color: #111111; font-weight: 800; font-size: 84px;
               line-height: 1.15; }
      .line { white-space: nowrap; }
      .w { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.3" data-width="1080" data-height="1920"
         data-fps="30">
      <div class="title clip" data-start="0" data-duration="2.3" data-track-index="0">
        <div class="line"><span class="w">DESIGNED</span> <span class="w">FOR</span></div>
        <div class="line"><span class="w">FOCUS.</span></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".w", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.15 }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
