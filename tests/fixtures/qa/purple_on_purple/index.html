<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 100%; height: 100%; font-family: sans-serif; }
      .card { position: absolute; left: 90px; top: 700px; width: 900px; height: 300px; background: #6a0dad; }
      .label { position: absolute; left: 40px; top: 90px; color: #6a0dad; font-weight: 700; font-size: 60px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1.5" data-width="1080" data-height="1920"
         data-fps="30">
      <div class="card clip" data-start="0" data-duration="1.5" data-track-index="0">
        <div class="label">Same as the card</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
