<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 100%; height: 100%; font-family: sans-serif; }
      .headline { position: absolute; left: 150px; top: 820px; color: #111111; font-weight: 700; font-size: 100px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.0" data-width="1080" data-height="1920"
         data-fps="30">
      <div class="headline clip" data-start="0" data-duration="2.0" data-track-index="0">Arrive.</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".headline", { x: -500 }, { x: 0, duration: 0.7, ease: "power2.out" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
