[project]
name = "social-studio"
version = "0.1.0"
description = "Local CLI that makes motion-graphics videos in isolated LLM sessions, keeps a SQLite library and autoposts approved videos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
social-studio = "social_studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/social_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.dev/pytest"
